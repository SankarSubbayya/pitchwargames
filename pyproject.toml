[project]
name = "pitch-lens"
version = "0.1.0"
description = "AI-powered pitch prep — turns any judge/investor's name into a structured briefing pack with Apify-scraped sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=2.5",
    "anthropic>=0.40",
    "streamlit>=1.40",
    "pydantic>=2",
    "python-dotenv>=1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pitch_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits real Apify or Anthropic APIs; skipped by default. Run with `pytest -m integration`.",
]
addopts = "-m 'not integration'"
